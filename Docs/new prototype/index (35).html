<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit,addDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg=window.NUDTEE_FIREBASE;
if(cfg&&!/PASTE/.test(cfg.apiKey)){
  const app=initializeApp(cfg),auth=getAuth(app),prov=new GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  const api=window.NudteeAuth={
    signIn:async()=>{
      try{await signInWithPopup(auth,prov)}
      catch(e){
        if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await signInWithRedirect(auth,prov);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')throw e;
      }
    },
    signOut:()=>signOut(auth)
  };
  const db=getFirestore(app);
  const RC=()=>collection(db,'rooms'),RD=id=>doc(db,'rooms',String(id));
  window.NudteeDB={
    listen:(ok,bad)=>onSnapshot(RC(),sn=>ok(sn.docs.map(d=>d.data())),bad),
    create:(id,data)=>setDoc(RD(id),data),
    update:(id,patch)=>updateDoc(RD(id),patch),
    remove:id=>deleteDoc(RD(id)),
    join:(id,m)=>runTransaction(db,async tx=>{
      const sn=await tx.get(RD(id));if(!sn.exists())throw new Error('gone');
      const d=sn.data(),ms=d.members||[];
      if(ms.some(x=>x.uid===m.uid))return ms;
      if(ms.length>=d.max)throw new Error('full');
      const n=ms.concat([m]);tx.update(RD(id),{members:n});return n;
    }),
    leave:(id,uid)=>runTransaction(db,async tx=>{
      const sn=await tx.get(RD(id));if(!sn.exists())throw new Error('gone');
      const n=(sn.data().members||[]).filter(x=>x.uid!==uid);tx.update(RD(id),{members:n});return n;
    }),
    chat:(id,ok,bad)=>onSnapshot(query(collection(db,'rooms',String(id),'messages'),orderBy('ts'),limit(200)),sn=>ok(sn.docs.map(d=>d.data())),bad),
    send:(id,m)=>addDoc(collection(db,'rooms',String(id),'messages'),{...m,ts:Date.now()})
  };
  onAuthStateChanged(auth,u=>{
    window.dispatchEvent(new CustomEvent('nudtee-auth',{detail:u?{uid:u.uid,name:u.displayName||'',email:u.email||'',photo:u.photoURL||''}:null}));
  });
}
</script>

function dateStr(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(LOC[LANG]||'en-US',{month:'short',day:'numeric',year:'numeric'})}
function tShort(t){var p=t.split(':'),h=+p[0],m=p[1],ap=h>=12?'p.m.':'a.m.';h=h%12||12;return h+(m==='00'?'':'.'+m)+ap}
function tLong(t){var p=t.split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function rangeShort(r){return tShort(r.start)+' - '+tShort(r.end)}
function rangeLong(r){return tLong(r.start)+' – '+tLong(r.end)}
function firstSentence(s){var m=/^[^.!?]*[.!?]/.exec(s);return m?m[0]:s}

function R(id,o){o.id=id;o.n=o.n||1;o.chat=o.chat||[];o.img=o.img||'';o.avatar=o.avatar||AVS[id%4];o.phase=o.phase||'upcoming';o.min=o.min||2;return o}

function startAt(r){return tsOf(r.date,r.start)}
function endAt(r){return tsOf(r.date,r.end)}
function deadlineAt(r){return tsOf(r.deadline,'23:59')+59999}
function phaseOf(r){var n=Date.now();return n>=endAt(r)?'completed':(n>=startAt(r)?'ongoing':'upcoming')}
function mapQ(r){return r.lat!=null?r.lat+','+r.lon:r.meet+' '+r.loc}
function status(r){
 if(r.closed)return 'closed';
 if(r.mine)return 'joined';
 if(r.n>=r.max)return 'full';
 if(r.phase!=='upcoming'||Date.now()>deadlineAt(r))return 'closed';
 return (r.max-r.n<=1||r.n/r.max>=.8)?'almost':'open';
}

var LOC={th:'th-TH',zh:'zh-CN',es:'es-ES',hi:'hi-IN',ar:'ar-EG',fr:'fr-FR',pt:'pt-BR',ru:'ru-RU',ja:'ja-JP'};
function tr(s){
 var d=TR[LANG];if(!d)return s;
 if(d[s]!=null)return d[s];
 var ps=PAT[LANG]||[],i,k;
 for(i=0;i<ps.length;i++)if(ps[i][0].test(s))return s.replace(ps[i][0],ps[i][1]);
 for(k in d)if(k.charAt(k.length-1)===':'&&s.indexOf(k)===0)return d[k]+s.slice(k.length);
 return s;
}
function xNode(n){
 if(n.nodeType===3){
  if(n.__t!=null&&n.data===n.__t)return;
  var m=/^(\s*)([\s\S]*?)(\s*)$/.exec(n.data);if(!m[2])return;
  var t=tr(m[2]);if(t!==m[2]){n.__o=n.data;n.data=m[1]+t+m[3];n.__t=n.data}
  return;
 }
 if(n.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName))return;
 ['aria-label','placeholder'].forEach(function(a){
  var v=n.getAttribute(a);if(v==null)return;
  n.__a=n.__a||{};var x=n.__a[a];if(x&&x.t===v)return;
  var t=tr(v);if(t!==v){n.__a[a]={o:v,t:t};n.setAttribute(a,t)}
 });
 for(var c=n.firstChild;c;c=c.nextSibling)xNode(c);
}
function xRestore(n){
 if(n.nodeType===3){if(n.__t!=null&&n.data===n.__t)n.data=n.__o;n.__t=null;return}
 if(n.nodeType!==1)return;
 if(n.__a){for(var a in n.__a)if(n.getAttribute(a)===n.__a[a].t)n.setAttribute(a,n.__a[a].o);n.__a=null}
 for(var c=n.firstChild;c;c=c.nextSibling)xRestore(c);
}
new MutationObserver(function(ms){
 if(LANG==='en')return;
 ms.forEach(function(m){
  if(m.type==='childList')m.addedNodes.forEach(xNode);
  else if(m.type==='characterData')xNode(m.target);
  else xNode(m.target);
 });
}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['aria-label','placeholder']});
function renderLang(){
 $('#lang-btn').textContent=LANGS[LANG].short;
 $('#lang-menu').innerHTML=Object.keys(LANGS).map(function(c){return '<button type="button" data-lang="'+c+'" aria-current="'+(c===LANG)+'">'+LANGS[c].name+'</button>'}).join('');
}
function setLang(c){
 if(!LANGS[c])return;
 xRestore(document.body);LANG=c;
 try{localStorage.setItem('nudtee-lang',c)}catch(e){}
 document.documentElement.lang=c;
 renderLang();$('#lang-menu').hidden=true;
 route(true);xNode(document.body);
}

/* ---------- auto close when the event end time is reached ---------- */
function tick(q){
 var changed=false,gone=false,v=/^#(?:room|info)-(\d+)$/.exec(location.hash||'');
 rooms.slice().forEach(function(r){
  var p=phaseOf(r);
  if(p!==r.phase){r.phase=p;changed=true}
  if(p==='completed'&&!r.closed){
   r.closed=true;changed=true;
   if(r.mine&&!q)toast('“'+r.name+'” has ended and was closed automatically.');
   else{rooms.splice(rooms.indexOf(r),1);if(v&&+v[1]===r.id)gone=true}
  }
 });
 if(!changed)return;
 if(gone&&!q){toast('This room has ended and was closed automatically.');go('feed');return}
 var h=location.hash;
 if(h==='#feed')renderCards();
 else if(h==='#activities')renderActs();
 else if(v&&$('#modal').hidden)route(true);
}
setInterval(tick,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

/* ---------- routing ---------- */
var VIEWS=['login','feed','room','map','create','profile','acts'];
var stack=[],backing=false;
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function goBack(){
 stack.pop();
 var prev=stack[stack.length-1];
 if(!prev||prev==='login')prev='feed';
 if(location.hash==='#'+prev){route();return}
 backing=true;location.hash=prev;
}
function show(v){VIEWS.forEach(function(x){$('#v-'+x).hidden=(x!==v)});window.scrollTo(0,0)}
function route(keep){
 var h=(location.hash||'').replace(/^#/,''),m;
 if(!backing&&stack[stack.length-1]!==h)stack.push(h||'login');
 backing=false;
 closeModal();
 if(authOn()){
  if(!authReady){show('none');return}
  if(!authUser&&h&&h!=='login'){show('login');return}
  if(authUser&&(!h||h==='login')){location.hash='feed';return}
 }
 if(!h||h==='login'){show('login');return}
 if(h==='feed'){show('feed');renderFeed();return}
 if(h==='create'){show('create');if(keep!==true)openCreate();return}
 if(h==='profile'){show('profile');renderProfile();return}
 if(h==='activities'){show('acts');renderActs();return}
 if((m=/^room-(\d+)$/.exec(h))){show('room');renderRoom(m[1]);return}
 if((m=/^info-(\d+)$/.exec(h))){show('room');renderRoom(m[1],'info');return}
 if((m=/^map-(\d+)$/.exec(h))){
  var mr=byId(m[1]);
  if(mr)$('#map-open').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapQ(mr));
  if(mr)$('#map-frame').src='https://www.google.com/maps?q='+encodeURIComponent(mapQ(mr))+'&z=16&output=embed';
  show('map');return}
 show('login');
}
window.addEventListener('hashchange',function(){route()});

 if(t.hasAttribute('data-sub')){st.sub=t.getAttribute('data-sub');renderPick();renderCards();return}
 if(t.hasAttribute('data-cat')){st.cat=t.getAttribute('data-cat');st.sub='';renderFeed();return}
 if(t.hasAttribute('data-join')){join(t.getAttribute('data-join'),t.getAttribute('data-from')==='detail'?false:'feed');return}
 if(t.hasAttribute('data-more')){openMore(t.getAttribute('data-more'));return}
 if(t.hasAttribute('data-kick')){var kk=t.getAttribute('data-kick').split(':');kick(kk[0],+kk[1]);return}
 if(t.hasAttribute('data-close-room')){askCloseRoom(t.getAttribute('data-close-room'));return}
 if(t.hasAttribute('data-confirm-close')){closeRoom(t.getAttribute('data-confirm-close'));return}
 if(t.hasAttribute('data-leave')){leave(t.getAttribute('data-leave'));return}
 if(t.hasAttribute('data-chat')){openChat(t.getAttribute('data-chat'));return}
 if(t.hasAttribute('data-mode')){setMode(t.getAttribute('data-mode')==='online');return}
 if(t.hasAttribute('data-prof')){var pp=t.getAttribute('data-prof').split(':');openProf(pp[0],+pp[1]);return}
 if(t.hasAttribute('data-people')){openPeople(t.getAttribute('data-people'));return}
 if(t.hasAttribute('data-close')){closeModal();return}
 if(t.hasAttribute('data-back')){goBack();return}
 if(t.hasAttribute('data-home')){go('feed');return}
 if(t.id==='fab'){go('create');return}
 if(t.id==='nav-profile'){go('profile');return}
 if(t.id==='nav-acts'){go('activities');return}
 if(t.id==='nav-chat'){openChatList();return}
 if(t.hasAttribute('data-tab')){st.tab=t.getAttribute('data-tab');renderActs();return}
 if(t.id==='int-btn'){var mn=$('#int-menu');mn.hidden=!mn.hidden;t.setAttribute('aria-expanded',String(!mn.hidden));return}
 if(t.hasAttribute('data-int')){
  var c=t.getAttribute('data-int'),i=st.ints.indexOf(c);
  if(i>=0)st.ints.splice(i,1);else st.ints.push(c);
  t.setAttribute('aria-pressed',String(i<0));$('#int-txt').textContent=st.ints.join(', ');return}
 if(t.hasAttribute('data-share')){
  closeModal();var u=location.href;
  try{navigator.clipboard.writeText(u).then(function(){toast('Link copied.')},function(){toast('Copy the link from the address bar.')})}catch(x){toast('Copy the link from the address bar.')}
  return}
});
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if(!$('#modal').hidden){closeModal();return}
 if(!$('#pick-menu').hidden){setPick(false);return}
 var h=location.hash;if(h&&h!=='#feed'&&h!=='#login')goBack();
});
$('#f-cat').addEventListener('change',fillSub);
$('#f-loc').addEventListener('input',function(){
 locClear();clearTimeout(locT);var q=this.value.trim();
 if(q.length<2){locSeq++;locShow(false);return}
 locT=setTimeout(function(){locSearch(q)},500);
});
$('#f-loc').addEventListener('focus',function(){if(!locSel&&locRes.length&&this.value.trim().length>=2)locShow(true)});
$('#f-loc').addEventListener('keydown',function(e){
 if(e.key==='Enter'){e.preventDefault();clearTimeout(locT);if(locSel)return;if(locRes.length&&!$('#loc-res').hidden)locPick(0);else if(this.value.trim().length>=2)locSearch(this.value.trim())}
 else if(e.key==='Escape'&&!$('#loc-res').hidden){e.stopPropagation();locShow(false)}
});
document.addEventListener('click',function(e){if(!e.target.closest('#loc-res')&&e.target.id!=='f-loc'&&!$('#loc-res').hidden)locShow(false)});
$('#create-form').addEventListener('submit',submitCreate);
$('#prof-form').addEventListener('submit',saveProfile);
$('#f-img').addEventListener('change',function(){readFile(this,function(d){st.newImg=d;var p=$('#img-prev');p.style.backgroundImage='url('+d+')';p.hidden=false},900,.72)});
$('#p-img').addEventListener('change',function(){readFile(this,function(d){st.profImg=d;paintProf()},640)});

window.addEventListener('nudtee-auth',function(e){
 var u=e.detail;authReady=true;authUser=u;loadProfile();
 if(u&&!profile.name){
  var em=(u.email||'user').split('@')[0];
  profile.name=u.name||em;profile.user=em.replace(/[^\w.]/g,'').slice(0,24)||'user';profile.img=u.photo||'';
  try{localStorage.setItem(pkey(),JSON.stringify(profile))}catch(x){}
 }
 if(u&&window.NudteeDB)startCloud();else{stopCloud();if(authOn())rooms=[]}
 if(!u&&location.hash&&location.hash!=='#login'){location.hash='login';return}
 route(true);
});
if(authOn())setTimeout(function(){if(!authReady){authReady=true;toast('Could not reach Firebase. Check your connection.');route(true)}},8000);
document.documentElement.lang=LANG;renderLang();
tick(true);route();xNode(document.body);
})();
</script>

</body>
</html>
