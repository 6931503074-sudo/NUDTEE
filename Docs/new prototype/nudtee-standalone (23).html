 if(s==='full'){toast('This room is full.');return}
 if(s==='closed'){toast('Registration is closed for this room.');return}
 r.mine=true;r.n++;toast('You joined “'+r.name+'”.');
 if(stay){route(true)}else go('room-'+id);
 if(stay==='feed')renderCards();
}

function participants(r){
 var out=[r.host],i=0,nm=['Mint','Beam','Ploy','Ton','Fah','Nine','Ice','Palm','Bam','Aom','Tan','Kwang'];
 var extra=r.n-1-(r.mine&&r.host!=='You'?1:0);
 while(extra>0){out.push(nm[i%nm.length]);i++;extra--}
 if(r.mine&&out.indexOf('You')<0)out.push('You');
 return out;
}

/* ---------- chat / participants ---------- */
function openModal(html){var m=$('#modal');m.innerHTML=html;m.hidden=false}
function closeModal(){$('#modal').hidden=true}
function openChat(id){
 var r=byId(id);
 if(!r.mine){toast('Join this room to use its chat.');return}
 var msgs=function(){return r.chat.map(function(m){return '<div class="msg'+(m.who==='You'?' me':'')+'"><small>'+esc(m.who)+'</small>'+esc(m.t)+'</div>'}).join('')||'<div class="mnote">No messages yet. Say hi.</div>'};
 openModal('<div class="mbox" role="dialog" aria-label="Room chat"><div class="mtop"><h3>'+esc(r.name)+'</h3><button type="button" data-close>Close</button></div><div class="msgs" id="msgs">'+msgs()+'</div><form class="cin" id="chat-form"><input id="chat-text" placeholder="Message the room" autocomplete="off" aria-label="Message"><button type="submit">Send</button></form></div>');
 var m=$('#msgs');m.scrollTop=m.scrollHeight;
 $('#chat-form').onsubmit=function(e){e.preventDefault();var t=$('#chat-text').value.trim();if(!t)return;r.chat.push({who:'You',t:t});$('#msgs').innerHTML=msgs();$('#chat-text').value='';var mm=$('#msgs');mm.scrollTop=mm.scrollHeight};
 setTimeout(function(){var i=$('#chat-text');if(i)i.focus()},30);
}
function openChatList(){
 var mine=rooms.filter(function(r){return r.mine});
 openModal('<div class="mbox" role="dialog" aria-label="Chats"><div class="mtop"><h3>Chats</h3><button type="button" data-close>Close</button></div><div class="mlist">'+(mine.length?mine.map(function(r){var l=r.chat[r.chat.length-1];return '<button type="button" data-chat="'+r.id+'"><b>'+esc(r.name)+'</b><span>'+esc(l?l.who+': '+l.t:'No messages yet')+'</span></button>'}).join(''):'<div class="mnote">Join a room to chat with its members.</div>')+'</div></div>');
}
function openPeople(id){
 var r=byId(id),ps=participants(r);
 openModal('<div class="mbox" role="dialog" aria-label="Participants"><div class="mtop"><h3>Participants ('+ps.length+')</h3><button type="button" data-close>Close</button></div><div class="mlist">'+ps.map(function(p,i){return '<div class="pp">'+avatar(i===0?r.avatar:A.alien)+'<span>'+esc(p)+'</span></div>'}).join('')+'</div></div>');
}

/* ---------- routing ---------- */
var VIEWS=['login','feed','room','map','create','profile','acts'];
var stack=[],backing=false;
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function goBack(){
 stack.pop();
 var prev=stack[stack.length-1];
 if(!prev||prev==='login')prev='feed';
 if(location.hash==='#'+prev){route();return}
 backing=true;location.hash=prev;
}
function show(v){VIEWS.forEach(function(x){$('#v-'+x).hidden=(x!==v)});window.scrollTo(0,0)}
function route(keep){
 var h=(location.hash||'').replace(/^#/,''),m;
 if(!backing&&stack[stack.length-1]!==h)stack.push(h||'login');
 backing=false;
 closeModal();
 if(!h||h==='login'){show('login');return}
 if(h==='feed'){show('feed');renderFeed();return}
 if(h==='create'){show('create');if(keep!==true)openCreate();return}
 if(h==='profile'){show('profile');renderProfile();return}
 if(h==='activities'){show('acts');renderActs();return}
 if((m=/^room-(\d+)$/.exec(h))){show('room');renderRoom(m[1]);return}
 if((m=/^map-(\d+)$/.exec(h))){
  var mr=byId(m[1]);
  if(mr)$('#map-open').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mr.meet+' '+mr.loc);
  if(mr)$('#map-frame').src='https://www.google.com/maps?q='+encodeURIComponent(mr.meet+' '+mr.loc)+'&output=embed';
  show('map');return}
 show('login');
}
window.addEventListener('hashchange',function(){route()});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var pk=$('#pick-box');
 if(!e.target.closest('.pick')&&!$('#pick-menu').hidden)setPick(false);
 if(!e.target.closest('.intp')&&!$('#int-menu').hidden){$('#int-menu').hidden=true;$('#int-btn').setAttribute('aria-expanded','false')}
 if(e.target.id==='modal'){closeModal();return}
 var t=e.target.closest('button,a');
 if(!t)return;
 if(t.id==='go-login'){go('feed');return}
 if(t.id==='pick-btn'){setPick($('#pick-menu').hidden);return}
 if(t.hasAttribute('data-sub')){st.sub=t.getAttribute('data-sub');renderPick();renderCards();return}
 if(t.hasAttribute('data-cat')){st.cat=t.getAttribute('data-cat');st.sub='';renderFeed();return}
 if(t.hasAttribute('data-join')){join(t.getAttribute('data-join'),t.getAttribute('data-from')==='detail'?false:'feed');return}
 if(t.hasAttribute('data-leave')){leave(t.getAttribute('data-leave'));return}
 if(t.hasAttribute('data-chat')){openChat(t.getAttribute('data-chat'));return}
 if(t.hasAttribute('data-people')){openPeople(t.getAttribute('data-people'));return}
 if(t.hasAttribute('data-close')){closeModal();return}
 if(t.hasAttribute('data-back')){goBack();return}
 if(t.id==='fab'){go('create');return}
 if(t.id==='nav-profile'){go('profile');return}
 if(t.id==='nav-acts'){go('activities');return}
 if(t.id==='nav-chat'){openChatList();return}
 if(t.hasAttribute('data-tab')){st.tab=t.getAttribute('data-tab');renderActs();return}
 if(t.id==='int-btn'){var mn=$('#int-menu');mn.hidden=!mn.hidden;t.setAttribute('aria-expanded',String(!mn.hidden));return}
 if(t.hasAttribute('data-int')){
  var c=t.getAttribute('data-int'),i=st.ints.indexOf(c);
  if(i>=0)st.ints.splice(i,1);else st.ints.push(c);
  t.setAttribute('aria-pressed',String(i<0));$('#int-txt').textContent=st.ints.join(', ');return}
 if(t.hasAttribute('data-share')){
  var u=location.href;
  try{navigator.clipboard.writeText(u).then(function(){toast('Link copied.')},function(){toast('Copy the link from the address bar.')})}catch(x){toast('Copy the link from the address bar.')}
  return}
});
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if(!$('#modal').hidden){closeModal();return}
 if(!$('#pick-menu').hidden){setPick(false);return}
 var h=location.hash;if(h&&h!=='#feed'&&h!=='#login')goBack();
});
$('#f-cat').addEventListener('change',fillSub);
$('#create-form').addEventListener('submit',submitCreate);
$('#prof-form').addEventListener('submit',saveProfile);
$('#f-img').addEventListener('change',function(){readFile(this,function(d){st.newImg=d;var p=$('#img-prev');p.style.backgroundImage='url('+d+')';p.hidden=false})});
$('#p-img').addEventListener('change',function(){readFile(this,function(d){st.profImg=d;paintProf()})});

route();
})();
</script>
