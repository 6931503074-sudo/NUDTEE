<style>
:root{--main:#658FCC;--sec:#83ABD7;--tx:#252D46;--ok:#2B6731;--near:#E5E5AB;--full:#E5ABAB;--pale:#CFDDF0;--navy:#3F5391;--bg:#83ABD7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#6F97C4}}
html,body{margin:0;height:100%}*{box-sizing:border-box}
body{font:16px/1.5 Sarabun,system-ui,sans-serif;color:var(--tx);background:var(--bg);display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
.light{background:var(--pale)}body.l{background:var(--pale)}
h1{font-size:32px;margin:0}h2{font-size:20px;margin:0}small,.s{font-size:13px}
.logo{font:italic 800 44px/0.95 Sarabun,serif;color:#1F49B0;background:#9BB8EE;border:10px solid #83A6EE;border-radius:60px;padding:22px 34px;display:inline-block;text-align:center;transform:rotate(-2deg)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.pill{background:var(--pale);border-radius:28px;padding:12px 18px;text-align:center;font-weight:700;font-size:20px}
.btn{border:0;border-radius:999px;padding:12px 20px;font:600 16px Sarabun,sans-serif;cursor:pointer;background:var(--pale);color:var(--tx);min-height:44px}
.btn.p{background:var(--navy);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.w{width:100%}
.row{display:flex;gap:10px}.row>*{flex:1}.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:8px 16px;background:var(--pale);color:var(--tx);font:600 15px Sarabun;cursor:pointer;min-height:40px}
.chip.on{background:var(--navy);color:#fff}
.card{background:var(--pale);border-radius:20px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.Open{background:#D5EBD6;color:var(--ok)}.Almost{background:var(--near);color:#6B5A10}.Full{background:var(--full);color:#7A2020}
.form{background:var(--main);padding:16px;display:flex;flex-direction:column;gap:6px;border-radius:12px}
label{font-weight:700;margin-top:6px}
input,select{width:100%;border:0;border-radius:999px;background:var(--pale);padding:12px 16px;font:16px Sarabun;color:var(--tx);min-height:44px}
.err{color:#7A1010;background:var(--full);border-radius:12px;padding:8px 12px;font-size:14px}
.okm{color:var(--ok);background:#D5EBD6;border-radius:12px;padding:8px 12px;font-size:14px}
.box{background:var(--main);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.muted{opacity:.8;font-size:13px}.live{color:#B8FF6A;font-size:13px;font-weight:600}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:44px;display:grid;place-items:center;margin:0 auto}
@keyframes in{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}.anim{animation:in 1.2s ease both}
.lg{width:min(78%,320px);height:auto}
#g{background:#E3ECF7;border-radius:22px;font-size:20px;padding:16px 20px}.pill{border-radius:24px;box-shadow:0 1px 0 rgba(37,45,70,.15)}.card{box-shadow:0 2px 0 rgba(37,45,70,.12)}.box{background:var(--main)}
.m{display:block;margin:0 auto;height:auto;max-width:100%}
.mid{align-items:center;text-align:center;padding:22px}

body.l{background:linear-gradient(180deg,#E3EEFB,#CFE0F5)}
.card{background:#EEF4FC;border-radius:22px;transition:transform .15s}.card:hover{transform:translateY(-2px)}
.pill{background:#EEF4FC;border-radius:999px}.btn{background:#EEF4FC}.btn.p{background:var(--navy)}.chip{background:#EEF4FC}.chip.on{background:var(--navy)}

 else{const now=Date.now(),a0=rooms.filter(r=>(filter=='All'||r.genre==filter)&&(r.closed?r.members.includes(me.id):r.dt>now-36e5*3)),a=np?a0.filter(r=>r.lat!=null&&dist(r)<=rad).sort((x,y)=>dist(x)-dist(y)):a0;if(np){const h=a0.filter(r=>r.lat==null).length;$('ne').innerHTML=h?`<div class="muted">${h} room(s) without a map pin are hidden</div>`:''}L.innerHTML=a.length?a.map(card).join(''):'<div class="box mid">'+mas(1,130)+(np?'No pinned rooms within '+rad+' km — try a wider range or create one':'No rooms yet — tap + Create Room to make the first one')+'</div>'}
